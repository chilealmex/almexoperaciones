{% if nav.submodulos %}
<div class="submodule-bar">
  <div class="container">
    <nav class="submodule-scroll" aria-label="Secciones de {{ nav.modulo_activo.etiqueta }}">
      <span class="submodule-title">
        <span aria-hidden="true">{{ nav.modulo_activo.icono }}</span>{{ nav.modulo_activo.etiqueta }}
      </span>
      {% for submodulo in nav.submodulos %}
      <a class="submodule-link{{ ' active' if submodulo.activo else '' }}"
         href="{{ url_for(submodulo.endpoint) }}"
         {% if submodulo.activo %}aria-current="page"{% endif %}>{{ submodulo.etiqueta }}</a>
      {% endfor %}
    </nav>
  </div>
</div>
{% endif %}
