# ATENCIÓN: Render NO está aplicando este archivo.
#
# Está comprobado: acá dice "--workers 2 --threads 8" y el servidor corre
# "--workers 3"; acá el buildCommand tiene cuatro tramos y el panel tiene tres.
# El panel de Render quedó congelado antes del 1 de agosto de 2026 y no volvió
# a sincronizarse. Ya había pasado en julio (ver el commit que revierte el
# cambio de nombre del servicio con el comentario "Render no lo aplica via
# Blueprint sync").
#
# O sea: MODIFICAR ESTE ARCHIVO NO CAMBIA NADA EN EL SERVIDOR.
#
# La fuente de verdad es el panel de Render (Settings y Environment). Este
# archivo se mantiene porque describe la configuración correcta y porque sirve
# si algún día se reconecta el Blueprint, pero cualquier cambio hay que
# copiarlo a mano al panel.
#
# Los valores que deben estar en el panel, y qué hacer cuando un despliegue
# falla, están en docs/despliegue.md.

services:
  - type: web
    name: gestor-pyme
    runtime: python
    plan: free
    # Igual al del panel. El tramo de importar_respaldo_html.py se sacó: era una
    # carga inicial de una sola vez, ya hecha, y correrla en cada despliegue
    # sólo agregaba una forma más de que el build fallara.
    buildCommand: "pip install -r requirements.txt && flask db upgrade && python seeds/seed_dev.py"
    # Los procesos "sync" atienden UNA petición cada uno: con tres personas
    # usando el sistema quedaban todos ocupados, el chequeo de salud de Render
    # esperaba en la cola y a los 5 segundos daba la instancia por caída.
    # Con hilos se atienden 16 a la vez, y --preload carga la aplicación una
    # sola vez antes de dividirse, que en 512 MB se agradece.
    startCommand: "gunicorn wsgi:app --workers 2 --threads 8 --preload --timeout 120 --bind 0.0.0.0:$PORT"
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: FLASK_ENV
        value: production
      - key: FLASK_APP
        value: wsgi.py
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: EMPRESA_ID
        value: "1"
      - key: STORAGE_BACKEND
        value: local
      - key: R2_BUCKET
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_ENDPOINT_URL
        sync: false
